<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Регистрација – Патни планови</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <section class="ticket">
      <h1>Направи профил</h1>
      <p>Со профил ги чуваш твоите дестинации, датуми и пакување на едно место.</p>
      <div class="route">Скопје → Охрид<span>Следна дестинација: твоја по избор</span></div>
    </section>

    <form id="registerForm" novalidate>
      <h2>Регистрација</h2>

      <label for="rName">Име</label>
      <input type="text" id="rName" autocomplete="given-name">
      <div class="error" id="rNameErr"></div>

      <label for="rEmail">Е-пошта</label>
      <input type="email" id="rEmail" autocomplete="email" placeholder="ime@primer.mk">
      <div class="error" id="rEmailErr"></div>

      <label for="rPass">Лозинка</label>
      <input type="password" id="rPass" autocomplete="new-password">
      <div class="error" id="rPassErr"></div>

      <label for="rPass2">Повтори ја лозинката</label>
      <input type="password" id="rPass2" autocomplete="new-password">
      <div class="error" id="rPass2Err"></div>

      <button type="submit" class="submit" style="margin-top:18px">Креирај профил</button>
      <div class="msg" id="rMsg" role="status"></div>

      <p class="signup">Веќе имаш профил? <a href="login.html">Најави се</a></p>
    </form>
  </main>

<script src="auth.js"></script>
<script src="register.js"></script>
</body>
</html>
